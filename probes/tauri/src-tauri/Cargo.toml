[package]
name = "tauri-probe"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
arboard = "3"
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.52"
dirs = "5"
chrono = "0.4"
