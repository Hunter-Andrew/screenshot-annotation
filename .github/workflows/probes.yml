# Throwaway: builds the no-admin install probes for the stack decision.
name: install-probes
on:
  push:
    paths: ["probes/**", ".github/workflows/probes.yml"]
  workflow_dispatch:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet publish probes/dotnet/Probe.csproj -c Release -o probes/dotnet/publish
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" probes/dotnet/installer.iss'
      - uses: actions/upload-artifact@v4
        with: { name: DotnetProbe-Setup, path: probes/dotnet/out/DotnetProbe-Setup.exe }

  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate icons
        working-directory: probes/tauri
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $b = New-Object System.Drawing.Bitmap 512,512
          $g = [System.Drawing.Graphics]::FromImage($b); $g.Clear([System.Drawing.Color]::SteelBlue); $g.Dispose()
          $b.Save("$pwd\icon-src.png"); $b.Dispose()
          npx --yes @tauri-apps/cli@2 icon icon-src.png -o src-tauri/icons
      - name: Build
        working-directory: probes/tauri
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with: { name: TauriProbe-Setup, path: probes/tauri/src-tauri/target/release/bundle/nsis/*.exe }
