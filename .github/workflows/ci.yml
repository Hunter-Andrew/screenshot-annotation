name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # Optional Azure Trusted Signing credentials (repo secrets / variables); all empty = unsigned build.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      # Signing is optional. Unsigned builds are flagged with a warning and a run summary note (some
      # machines' Smart App Control may block unsigned installers; Andrew's laptop currently does not),
      # and release tags (v*) may be published unsigned. Half-configured signing is an error, so a
      # typo in one secret cannot silently produce an unsigned release.
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          missing=()
          [ -z "$AZURE_CLIENT_ID" ] && missing+=("secret AZURE_CLIENT_ID")
          [ -z "$AZURE_CLIENT_SECRET" ] && missing+=("secret AZURE_CLIENT_SECRET")
          [ -z "$AZURE_TENANT_ID" ] && missing+=("secret AZURE_TENANT_ID")
          [ -z "$TRUSTED_SIGNING_ENDPOINT" ] && missing+=("variable TRUSTED_SIGNING_ENDPOINT")
          [ -z "$TRUSTED_SIGNING_ACCOUNT" ] && missing+=("variable TRUSTED_SIGNING_ACCOUNT")
          [ -z "$TRUSTED_SIGNING_PROFILE" ] && missing+=("variable TRUSTED_SIGNING_PROFILE")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "artifact=Screenshot-Annotation-Setup" >> "$GITHUB_OUTPUT"
            echo "Signing: configured (Azure Trusted Signing)." >> "$GITHUB_STEP_SUMMARY"
          else
            list="$(IFS=,; echo "${missing[*]}")"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "artifact=Screenshot-Annotation-Setup" >> "$GITHUB_OUTPUT"
            echo "::warning title=Installer is unsigned::Smart App Control may block unsigned installers on some machines. Not configured: $list"
            echo "### Unsigned installer" >> "$GITHUB_STEP_SUMMARY"
            echo "This build is not code-signed. Not configured: $list. To sign, add them under Settings > Secrets and variables > Actions (secrets AZURE_*, variables TRUSTED_SIGNING_*)." >> "$GITHUB_STEP_SUMMARY"
            if [ "${#missing[@]}" -lt 6 ]; then
              echo "::error::Signing is only partly configured; set all six values or none. Not configured: $list"
              exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Per-user NSIS installer (installMode "currentUser" in src-tauri/tauri.conf.json, ADR 0001).
      # Signed with Azure Trusted Signing when the AZURE_* secrets and TRUSTED_SIGNING_* variables
      # exist (ADR 0006); otherwise the build is unsigned, as before.
      - name: Install signing tool
        if: steps.signing.outputs.signed == 'true'
        run: cargo install trusted-signing-cli --locked

      - name: Build installer (signed)
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          npx tauri build --config "{\"bundle\":{\"windows\":{\"signCommand\":\"trusted-signing-cli -e $TRUSTED_SIGNING_ENDPOINT -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d \\\"Screenshot Annotation\\\" %1\"}}}"

      - name: Build installer (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: npx tauri build

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "Installer is not validly signed" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Pushing a vX.Y.Z tag publishes a GitHub Release with the installer attached (ADR 0006).
  # `needs` means a failing test, build or upload step above skips this job entirely.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestation below (free for public repositories).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ]; then
            echo "Tag v$tag does not match package.json ($pkg) / tauri.conf.json ($conf)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Screenshot-Annotation-Setup
          path: dist-release

      # The installer is not code-signed by a certificate authority (ADR 0006), so what is offered instead is a
      # way to check that the file is exactly what this workflow built from this tag: a SHA-256 list, and a
      # GitHub build provenance attestation (verifiable with `gh attestation verify`).
      - name: Checksums
        working-directory: dist-release
        run: sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-release/*.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-intro.md <<'EOF'
          Install: download the `*-setup.exe` below and run it (per user, no admin needed). Windows SmartScreen may say "Windows protected your PC": choose **More info, then Run anyway**. The installer is not code-signed (ADR 0006).

          To check the download is the file this release built, compare its SHA-256 with `SHA256SUMS.txt` (PowerShell: `Get-FileHash <file> -Algorithm SHA256`), or run `gh attestation verify <file> --repo ${{ github.repository }}`.

          EOF
          gh release create "$GITHUB_REF_NAME" dist-release/*.exe dist-release/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --notes-file release-intro.md --generate-notes --verify-tag
