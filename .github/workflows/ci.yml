name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # Optional Azure Trusted Signing credentials (repo secrets / variables); all empty = unsigned build.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Per-user NSIS installer (installMode "currentUser" in src-tauri/tauri.conf.json, ADR 0001).
      # Signed with Azure Trusted Signing when the AZURE_* secrets and TRUSTED_SIGNING_* variables
      # exist (ADR 0006); otherwise the build is unsigned, as before. Smart App Control blocks
      # unsigned installers, so releases should be signed.
      - name: Install signing tool
        if: env.AZURE_CLIENT_ID != ''
        run: cargo install trusted-signing-cli --locked

      - name: Build installer (signed)
        if: env.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          npx tauri build --config "{\"bundle\":{\"windows\":{\"signCommand\":\"trusted-signing-cli -e $TRUSTED_SIGNING_ENDPOINT -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d \\\"Screenshot Annotation\\\" %1\"}}}"

      - name: Build installer (unsigned)
        if: env.AZURE_CLIENT_ID == ''
        run: npx tauri build

      - name: Verify signature
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "Installer is not validly signed" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Annotation-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Pushing a vX.Y.Z tag publishes a GitHub Release with the installer attached (ADR 0006).
  # `needs` means a failing test, build or upload step above skips this job entirely.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ]; then
            echo "Tag v$tag does not match package.json ($pkg) / tauri.conf.json ($conf)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Screenshot-Annotation-Setup
          path: dist-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/*.exe \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
