name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Per-user NSIS installer (installMode "currentUser" in src-tauri/tauri.conf.json, ADR 0001).
      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Annotation-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Pushing a vX.Y.Z tag publishes a GitHub Release with the installer attached (ADR 0006).
  # `needs` means a failing test, build or upload step above skips this job entirely.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ]; then
            echo "Tag v$tag does not match package.json ($pkg) / tauri.conf.json ($conf)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Screenshot-Annotation-Setup
          path: dist-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/*.exe \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
